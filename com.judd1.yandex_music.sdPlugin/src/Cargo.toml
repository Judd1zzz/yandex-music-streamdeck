[workspace]
resolver = "2"
members = [
    "crates/sd-protocol",
    "crates/sd-host",
    "crates/ym-model",
    "crates/ym-render",
    "crates/ym-remote-controller",
    "crates/ym-ynison",
    "crates/ym-discord",
    "crates/ym-download",
    "crates/ym-update",
    "crates/ym-launch",
    "crates/ym-core",
    "crates/ym-plugin",
    "xtask",
    "../../../bridge/crates/ym-bridge-common",
    "../../../bridge/crates/ym-bridge-client",
    "../../../bridge/crates/ym-bridge-contracts",
    "../../../bridge/crates/ym-bridge-injection",
    "../../../bridge/crates/ym-bridge-session",
    "../../../bridge/crates/ym-bridge-lib",
    "../../../bridge/crates/ym-cdp-types",
    "../../../bridge/crates/ym-cdp-codegen",
    "../../../bridge/crates/ym-cdp-test",
    "../../../bridge/crates/ym-plugin-facade",
    "../../../bridge/crates/ym-launcher",
    "../../../bridge/crates/ym-verify",
    "../../../bridge/crates/ym-domain-transport",
    "../../../bridge/crates/ym-domain-volume",
    "../../../bridge/crates/ym-domain-likes",
    "../../../bridge/crates/ym-domain-lyrics",
    "../../../bridge/crates/ym-domain-media-meta",
    "../../../bridge/crates/ym-domain-discord",
    "../../../bridge/crates/ym-remote",
    "../../../bridge/xtask",
]

[workspace.package]
version = "2.5.0"
edition = "2024"
authors = ["judd1"]
license-file = "../../LICENSE"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
thiserror = "2"
anyhow = "1"
bitflags = "2"
sysinfo = "0.33"
file-rotate = "0.7"
base64 = "0.22"
lru = "0.12"
rust-embed = "8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ab_glyph = "0.2"
arboard = { version = "3", default-features = false }
discord-rich-presence = "0.2"
hmac = "0.12"
sha2 = "0.10"
ssh-key = { version = "0.6", default-features = false, features = ["ed25519", "std"] }
aes = "0.8"
ctr = "0.9"
lofty = "0.22"
symphonia = { version = "0.5.5", default-features = false, features = ["flac", "aac", "isomp4"] }
mp3lame-encoder = "0.2.4"
zip = { version = "2", default-features = false, features = ["deflate", "time"] }
semver = "1"
self-replace = "1"
time = { version = "0.3", features = ["local-offset"] }
tempfile = "3"
libc = "0.2"
ctor = "0.4"
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

sd-protocol = { path = "crates/sd-protocol" }
sd-host = { path = "crates/sd-host" }
ym-model = { path = "crates/ym-model" }
ym-render = { path = "crates/ym-render" }
ym-ynison = { path = "crates/ym-ynison" }
ym-discord = { path = "crates/ym-discord" }
ym-download = { path = "crates/ym-download" }
ym-update = { path = "crates/ym-update" }
ym-launch = { path = "crates/ym-launch" }
ym-core = { path = "crates/ym-core" }

ym-bridge-client = { path = "../../../bridge/crates/ym-bridge-client" }
ym-bridge-session = { path = "../../../bridge/crates/ym-bridge-session" }
ym-bridge-injection = { path = "../../../bridge/crates/ym-bridge-injection" }
ym-remote = { path = "../../../bridge/crates/ym-remote" }
ym-launcher = { path = "../../../bridge/crates/ym-launcher" }
ym-remote-controller = { path = "crates/ym-remote-controller" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "unwind"

[profile.release.build-override]
opt-level = 3

[profile.release.package.mp3lame-sys]
opt-level = 3

[profile.release.package.mp3lame-encoder]
opt-level = 3

[profile.release.package.symphonia]
opt-level = 3

[profile.release.package.symphonia-core]
opt-level = 3

[profile.release.package.symphonia-bundle-flac]
opt-level = 3

[profile.release.package.symphonia-codec-aac]
opt-level = 3

[profile.release.package.symphonia-format-isomp4]
opt-level = 3

[profile.release.package.symphonia-metadata]
opt-level = 3

[profile.release.package.symphonia-utils-xiph]
opt-level = 3
